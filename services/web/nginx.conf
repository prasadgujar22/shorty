# Shorty web: static SPA. Runs as non-root (nginx-unprivileged) on :8080,
# health/metrics endpoints on :9090 (never routed by the gateway).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Pre-compressed assets produced by adapter-static (precompress: true).
    gzip_static on;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    include /etc/nginx/snippets/security-headers.conf;

    # Content-hashed assets never change: cache forever.
    location /_app/immutable/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /favicon.svg { expires 1d; }
    location = /robots.txt  { expires 1d; }

    # SPA routes (/, /s/<slug>) all serve the shell; it must revalidate so a
    # deploy is picked up immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

server {
    listen 9090;
    server_name _;
    access_log off;

    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    # Static content has no dependencies: ready as soon as Nginx serves.
    location = /readyz  { default_type application/json; return 200 '{"nginx":"ok"}\n'; }
    # Scraped by the nginx-prometheus-exporter sidecar (exposes /metrics on :9113).
    location = /stub_status { stub_status; allow 127.0.0.1; deny all; }
}
