# Reusable image pipeline:
#   PR          -> build linux/amd64, scan with Trivy, no push
#   main / tag  -> build linux/amd64 + linux/arm64, push to GHCR (sha + semver
#                  tags), SBOM + provenance, Trivy scan of the pushed digest
#   main        -> commit the new tag into deploy/envs/dev/images.yaml (GitOps)
name: _build-image

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
    outputs:
      tag:
        description: Short git SHA tag that was pushed
        value: ${{ jobs.build.outputs.tag }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/shorty-${{ inputs.service }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - id: vars
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "push" ]]; then echo "push=true" >> "$GITHUB_OUTPUT"; else echo "push=false" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=main,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=shorty-${{ inputs.service }}

      # ---------- pull requests: build + scan, no push ----------
      - name: build (PR, amd64)
        if: steps.vars.outputs.push == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ inputs.service }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:pr
          build-args: |
            VERSION=${{ steps.vars.outputs.tag }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.service }}

      # ---------- main / tags: multi-arch push ----------
      - uses: docker/login-action@v4
        if: steps.vars.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push (amd64 + arm64)
        id: push
        if: steps.vars.outputs.push == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ inputs.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || steps.vars.outputs.tag }}
            COMMIT=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,scope=${{ inputs.service }},mode=max

      - name: attest build provenance
        if: steps.vars.outputs.push == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # ---------- security: Trivy (fail on fixable HIGH/CRITICAL) + SBOM ----------
      - id: ref
        run: |
          if [[ "${{ steps.vars.outputs.push }}" == "true" ]]; then
            echo "image=${IMAGE}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${IMAGE}:pr" >> "$GITHUB_OUTPUT"
          fi

      - name: Trivy image scan (SARIF for code scanning)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ inputs.service }}

      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_SKIP_DB_UPDATE: "true"
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.ref.outputs.image }}
          format: spdx-json
          artifact-name: sbom-${{ inputs.service }}.spdx.json
          upload-release-assets: false

      - name: summary
        run: |
          {
            echo "### shorty-${{ inputs.service }}"
            echo "- image: \`${{ steps.ref.outputs.image }}\`"
            echo "- tags: $(echo '${{ steps.meta.outputs.tags }}' | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

  # Pull-based CD: CI never touches the cluster. It records the new tag in Git
  # and Argo CD (running inside the laptop cluster) pulls the change.
  gitops-dev:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gitops-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: bump deploy/envs/dev/images.yaml
        env:
          SVC: ${{ inputs.service }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --quiet origin main
            yq -i ".\"${SVC}\".image.tag = \"${TAG}\"" deploy/envs/dev/images.yaml
            if git diff --quiet; then echo "already at ${TAG}"; exit 0; fi
            git commit -qam "chore(gitops): ${SVC} dev -> ${TAG}"
            git push origin HEAD:main && exit 0
            echo "push raced with another bump, retrying ($attempt)"; git reset -q --hard origin/main; sleep $((attempt * 3))
          done
          exit 1
