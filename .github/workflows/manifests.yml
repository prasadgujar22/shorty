# Helm lint + kubeconform for both environments and the Argo CD manifests.
name: manifests

on:
  pull_request:
    paths:
      - deploy/**
      - scripts/lint-manifests.sh
      - .github/workflows/manifests.yml
  push:
    branches: [main]
    paths:
      - deploy/**
      - scripts/lint-manifests.sh
      - .github/workflows/manifests.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v
      - run: helm repo add nats https://nats-io.github.io/k8s/helm/charts/
      - run: scripts/lint-manifests.sh
