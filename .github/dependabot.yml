version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "build(deps)" }
    groups:
      go-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /services/web
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "build(deps)" }
    groups:
      web-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "ci(deps)" }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: docker
    directories:
      - /services/links-svc
      - /services/redirect-svc
      - /services/analytics-svc
      - /services/web
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "build(deps)" }
    groups:
      base-images: { patterns: ["*"] }

  - package-ecosystem: helm
    directories:
      - /deploy/charts/shorty
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "build(deps)" }
