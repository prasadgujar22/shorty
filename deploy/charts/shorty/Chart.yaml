apiVersion: v2
name: shorty
description: "Shorty umbrella chart: services, data tier (CloudNativePG, Redis, NATS JetStream) and gateway routes."
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  # Also declared here (not only in each service chart): Argo CD runs
  # `helm dependency build` on this chart only, and named templates are
  # global across the chart tree, so the subcharts resolve shorty-lib.* here.
  - name: shorty-lib
    version: 0.1.0
    repository: file://../shorty-lib
  - name: links-svc
    version: 0.1.0
    repository: file://../links-svc
  - name: redirect-svc
    version: 0.1.0
    repository: file://../redirect-svc
  - name: analytics-svc
    version: 0.1.0
    repository: file://../analytics-svc
  - name: web
    version: 0.1.0
    repository: file://../web
  - name: nats
    version: 2.15.1
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.enabled
