{{- if .Values.redis.enabled }}
{{- $r := .Values.redis }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    {{- include "shorty.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  replicas: {{ $r.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: shorty
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: redis }
      containers:
        - name: redis
          image: {{ $r.image }}
          # Pure cache: no persistence, bounded memory, LRU eviction.
          args: ["--save", "", "--appendonly", "no", "--maxmemory", {{ $r.maxmemory | quote }}, "--maxmemory-policy", "allkeys-lru", "--tcp-keepalive", "30"]
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 10
          resources:
            {{- toYaml $r.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: data, mountPath: /data }]
        {{- if $r.exporter.enabled }}
        - name: exporter
          image: {{ $r.exporter.image }}
          env: [{ name: REDIS_ADDR, value: "redis://127.0.0.1:6379" }]
          ports: [{ name: metrics, containerPort: 9121 }]
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { cpu: 100m, memory: 48Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 59000
            capabilities: { drop: [ALL] }
        {{- end }}
      volumes: [{ name: data, emptyDir: { sizeLimit: 64Mi } }]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    {{- include "shorty.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
    - { name: metrics, port: 9121, targetPort: metrics }
{{- if gt (int $r.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
{{- end }}
{{- if and $r.exporter.enabled (include "shorty.hasMonitoring" .) }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  endpoints: [{ port: metrics, interval: 15s }]
{{- end }}
{{- end }}
