{{- $g := .Values.gateway }}
{{- $host := ternary (printf "Host(`%s`) && " $g.host) "" (ne $g.host "") }}
{{- /* Host-specific routes must beat host-less ones from other envs. */}}
{{- $p := ternary 1000 0 (ne $g.host "") }}
# Traefik routes. Explicit priorities make the catch-all /{slug} lose to
# every more specific route regardless of rule length.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: retry-idempotent
  labels:
    {{- include "shorty.labels" . | nindent 4 }}
spec:
  # Retries only when Traefik cannot reach a backend (e.g. a pod that just
  # died before its endpoint was removed). Attached to GET-only routes.
  retry:
    attempts: {{ $g.retry.attempts }}
    initialInterval: {{ $g.retry.initialInterval }}
{{- /* Named TraefikServices so gateway metrics read
   exported_service="<namespace>-<backend>@kubernetescrd" instead of a hash. */}}
{{- range $svc := list "links-svc" "analytics-svc" "web" "redirect-svc" }}
---
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: {{ $svc }}
  labels:
    {{- include "shorty.labels" $ | nindent 4 }}
spec:
  weighted:
    services:
      - { name: {{ $svc }}, port: 8080, weight: 1 }
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: shorty
  labels:
    {{- include "shorty.labels" . | nindent 4 }}
spec:
  entryPoints: [{{ $g.entryPoint }}]
  routes:
    - kind: Rule
      match: {{ printf "%sPathPrefix(`/api/links`)" $host | quote }}
      priority: {{ add $p 100 }}
      services: [{ name: links-svc, kind: TraefikService }]
    - kind: Rule
      match: {{ printf "%sPathPrefix(`/api/stats`)" $host | quote }}
      priority: {{ add $p 100 }}
      middlewares: [{ name: retry-idempotent }]
      services: [{ name: analytics-svc, kind: TraefikService }]
    - kind: Rule
      match: {{ printf "%s(Path(`/`) || PathPrefix(`/_app/`) || PathPrefix(`/s/`) || Path(`/favicon.svg`) || Path(`/robots.txt`))" $host | quote }}
      priority: {{ add $p 90 }}
      middlewares: [{ name: retry-idempotent }]
      services: [{ name: web, kind: TraefikService }]
    - kind: Rule
      match: {{ printf "%sPathPrefix(`/`)" $host | quote }}
      priority: {{ add $p 1 }}
      middlewares: [{ name: retry-idempotent }]
      services: [{ name: redirect-svc, kind: TraefikService }]
