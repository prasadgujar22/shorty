apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-dashboards
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/prasadgujar22/shorty.git
    targetRevision: main
    path: deploy/dashboards        # kustomize: dashboard ConfigMaps + PrometheusRule
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
