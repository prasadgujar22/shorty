# Adopts the release installed by scripts/platform.sh (same name/namespace).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cnpg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: "0.29.1"
      helm:
        releaseName: cnpg
        valueFiles: [$values/deploy/platform/cnpg/values.yaml]
    - repoURL: https://github.com/prasadgujar22/shorty.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
