# Loki single binary on the local filesystem: enough for a laptop, ~200 MB.
deploymentMode: SingleBinary
fullnameOverride: loki
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: index_, period: 24h }
  limits_config:
    retention_period: 48h
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester: { enabled: false }
  ui: { enabled: false }
singleBinary:
  replicas: 1
  persistence: { enabled: true, size: 2Gi }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
minio: { enabled: false }
monitoring:
  serviceMonitor: { enabled: true }
