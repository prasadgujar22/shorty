# Grafana Alloy as a DaemonSet: each pod tails the logs of pods on its own
# node via the Kubernetes API (no hostPath mounts), parses our JSON logs and
# ships them to Loki with namespace/app/pod/level labels.
controller:
  type: daemonset
alloy:
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 160Mi }
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.json.receiver]
      }

      // Shorty services log JSON (ts, level, msg, service, ...). Promote the
      // level to a label; keep everything else in the line.
      loki.process "json" {
        stage.json {
          expressions = { level = "level" }
        }
        stage.labels {
          values = { level = "" }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
        }
      }
serviceMonitor:
  enabled: true
