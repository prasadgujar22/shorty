# ha: every stateless service has >= 2 replicas spread across zones with a
# PDB; Postgres has a synchronous standby; NATS is a 3-node JetStream cluster
# with R3 streams; Redis has 2 independent cache replicas. Synced manually.
gateway:
  # Argo CD-managed env: own hostname (make deploy overrides this to "").
  host: ha.localhost

postgres:
  instances: 2

redis:
  replicas: 2

nats:
  config:
    cluster: { enabled: true, replicas: 3 }
  podTemplate:
    topologySpreadConstraints:
      topology.kubernetes.io/zone: { maxSkew: 1, whenUnsatisfiable: DoNotSchedule }

links-svc:
  replicaCount: 2
  pdb: { enabled: true, maxUnavailable: 1 }
  env:
    PUBLIC_BASE_URL: http://ha.localhost:8088
    DB_MAX_CONNS: 8

redirect-svc:
  pdb: { enabled: true, maxUnavailable: 1 }
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    cpuUtilization: 60
    # Custom metric via prometheus-adapter: scale out above 400 req/s per pod
    # (see docs/TUNING.md for how this threshold was chosen).
    rps: { enabled: true, averageValue: "400" }
  env:
    CLICKS_STREAM_REPLICAS: 3
    # Small stream = fast replica resync after a NATS restart (docs/TUNING.md).
    CLICKS_STREAM_MAX_BYTES: 268435456

analytics-svc:
  replicaCount: 2
  pdb: { enabled: true, maxUnavailable: 1 }
  env:
    CLICKS_STREAM_REPLICAS: 3
    # Small stream = fast replica resync after a NATS restart (docs/TUNING.md).
    CLICKS_STREAM_MAX_BYTES: 268435456
    DB_MAX_CONNS: 6

web:
  replicaCount: 2
  pdb: { enabled: true, maxUnavailable: 1 }
